<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Flower For Anne 🌸 - Gift #1</title>
    <style>
        *,
        *::after,
        *::before {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        :root {
            --dark-color: #000;
            --fl-speed: 0.8s;
        }

        body {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--dark-color);
            overflow: hidden;
            perspective: 1000px;
            padding: 50px 0px;
            user-select: none;
        }

        .night {
            position: fixed;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            filter: blur(0.1vmin);
        }

        /* Soft Faded Glowing Hearts Container (Behind Flowers) */
        #faded-hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .faded-heart {
            position: absolute;
            width: 55px;
            height: 55px;
            opacity: 0;
            filter: blur(3.5px);
            transform: translateY(0) scale(0.6) rotate(0deg);
            animation: floatUpFaded 5.5s ease-out forwards;
        }

        .faded-heart svg {
            width: 100%;
            height: 100%;
            fill: rgba(255, 160, 190, 0.45);
            filter: drop-shadow(0 0 12px rgba(255, 120, 160, 0.6));
        }

        @keyframes floatUpFaded {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.5) rotate(-5deg);
            }
            20% {
                opacity: 0.45;
                transform: translateY(-35px) scale(1) rotate(5deg);
            }
            65% {
                opacity: 0.35;
                transform: translateY(-150px) scale(1.1) rotate(-8deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-270px) scale(0.6) rotate(10deg);
            }
        }

        .flowers {
            position: relative;
            transform: scale(0.9);
        }

        .flower {
            position: absolute;
            bottom: 4vmin;
            transform-origin: bottom center;
            z-index: 10;
        }

        .flower--1 {
            animation: moving-flower-1 4s linear infinite;
        }

        .flower--1 .flower__line {
            height: 70vmin;
            animation-delay: 0.3s;
        }

        .flower--1 .flower__line__leaf--1 {
            animation: blooming-leaf-right var(--fl-speed) 1.6s backwards;
        }

        .flower--1 .flower__line__leaf--2 {
            animation: blooming-leaf-right var(--fl-speed) 1.4s backwards;
        }

        .flower--1 .flower__line__leaf--3 {
            animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
        }

        .flower--1 .flower__line__leaf--4 {
            animation: blooming-leaf-left var(--fl-speed) 1s backwards;
        }

        .flower--1 .flower__line__leaf--5 {
            animation: blooming-leaf-right var(--fl-speed) 1.8s backwards;
        }

        .flower--1 .flower__line__leaf--6 {
            animation: blooming-leaf-left var(--fl-speed) 2s backwards;
        }

        .flower--2 {
            left: 50%;
            transform: rotate(20deg);
            animation: moving-flower-2 4s linear infinite;
        }

        .flower--2 .flower__line {
            height: 60vmin;
            animation-delay: 0.6s;
        }

        .flower--2 .flower__line__leaf--1 {
            animation: blooming-leaf-right var(--fl-speed) 1.9s backwards;
        }

        .flower--2 .flower__line__leaf--2 {
            animation: blooming-leaf-right var(--fl-speed) 1.7s backwards;
        }

        .flower--2 .flower__line__leaf--3 {
            animation: blooming-leaf-left var(--fl-speed) 1.5s backwards;
        }

        .flower--2 .flower__line__leaf--4 {
            animation: blooming-leaf-left var(--fl-speed) 1.3s backwards;
        }

        .flower--3 {
            left: 50%;
            transform: rotate(-15deg);
            animation: moving-flower-3 4s linear infinite;
        }

        .flower--3 .flower__line {
            animation-delay: 0.9s;
        }

        .flower--3 .flower__line__leaf--1 {
            animation: blooming-leaf-right var(--fl-speed) 2.5s backwards;
        }

        .flower--3 .flower__line__leaf--2 {
            animation: blooming-leaf-right var(--fl-speed) 2.3s backwards;
        }

        .flower--3 .flower__line__leaf--3 {
            animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
        }

        .flower--3 .flower__line__leaf--4 {
            animation: blooming-leaf-left var(--fl-speed) 1.9s backwards;
        }

        .flower__leafs {
            position: relative;
            animation: blooming-flower 2s backwards;
        }

        .flower__leafs--1 {
            animation-delay: 1.1s;
        }

        .flower__leafs--2 {
            animation-delay: 1.4s;
        }

        .flower__leafs--3 {
            animation-delay: 1.7s;
        }

        .flower__leafs::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            transform: translate(-50%, -100%);
            width: 8vmin;
            height: 8vmin;
            background-color: #ff7b9c;
            filter: blur(10vmin);
        }

        /* PINK 5-PETAL FLOWER HEADS CONNECTED DIRECTLY TO STEMS (Zero Gap) */
        .pink-flower-head {
            position: absolute;
            left: 0;
            top: 0;
            transform: translate(-50%, -38%); /* Lowered position ~1cm to connect seamlessly with stem */
            width: 22vmin;
            height: 22vmin;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
        }

        .p-petal {
            position: absolute;
            width: 7.5vmin;
            height: 12.5vmin;
            border-radius: 50%;
            transform-origin: bottom center;
            bottom: 50%;
            left: calc(50% - 3.75vmin);
            opacity: 0.95;
        }

        .p-petal--1 { transform: rotate(0deg); }
        .p-petal--2 { transform: rotate(72deg); }
        .p-petal--3 { transform: rotate(144deg); }
        .p-petal--4 { transform: rotate(216deg); }
        .p-petal--5 { transform: rotate(288deg); }

        /* Color Gradients for 3 Pink Flowers */
        .pink-flower-center .p-petal {
            background-image: linear-gradient(to top, #ff537b, #ff7b9c, #ffa3b8);
            box-shadow: inset 0 0 1.5vmin rgba(255, 255, 255, 0.6), 0 0 15px rgba(255, 123, 156, 0.5);
        }

        .pink-flower-left .p-petal {
            background-image: linear-gradient(to top, #ff8b85, #ffb2a5, #ffd2c7);
            box-shadow: inset 0 0 1.5vmin rgba(255, 255, 255, 0.6), 0 0 15px rgba(255, 178, 165, 0.5);
        }

        .pink-flower-right .p-petal {
            background-image: linear-gradient(to top, #ff3b68, #ff6b8b, #ff8da7);
            box-shadow: inset 0 0 1.5vmin rgba(255, 255, 255, 0.6), 0 0 15px rgba(255, 107, 139, 0.5);
        }

        /* Center Yellow Pistil Core */
        .p-center {
            position: absolute;
            width: 7.5vmin;
            height: 7.5vmin;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffe066 30%, #ffb830 85%);
            box-shadow: 0 0 12px #ffea79, inset 0 0 6px rgba(255, 255, 255, 0.8);
            z-index: 10;
        }

        /* 5 White Glowing Dots for Main Center Flower */
        .p-dot {
            position: absolute;
            width: 1vmin;
            height: 1vmin;
            border-radius: 50%;
            background-color: #ffffff;
            box-shadow: 0 0 6px #ffffff;
            top: calc(50% - 0.5vmin);
            left: calc(50% - 0.5vmin);
        }

        .p-dot--1 { transform: rotate(0deg) translateY(-2.3vmin); }
        .p-dot--2 { transform: rotate(72deg) translateY(-2.3vmin); }
        .p-dot--3 { transform: rotate(144deg) translateY(-2.3vmin); }
        .p-dot--4 { transform: rotate(216deg) translateY(-2.3vmin); }
        .p-dot--5 { transform: rotate(288deg) translateY(-2.3vmin); }

        .flower__line {
            height: 55vmin;
            width: 1.5vmin;
            background-image: linear-gradient(
                to left,
                rgba(0, 0, 0, 0.2),
                transparent,
                rgba(255, 255, 255, 0.2)
            ),
            linear-gradient(to top, transparent 10%, #14757a, #39c6d6);
            box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
            animation: grow-flower-tree 4s backwards;
        }

        .flower__line__leaf {
            --w: 7vmin;
            --h: calc(var(--w) + 2vmin);
            position: absolute;
            top: 20%;
            left: 90%;
            width: var(--w);
            height: var(--h);
            border-top-right-radius: var(--h);
            border-bottom-left-radius: var(--h);
            background-image: linear-gradient(
                to top,
                rgba(20, 117, 122, 0.4),
                #39c6d6
            );
        }

        .flower__line__leaf--1 {
            transform: rotate(70deg) rotateY(30deg);
        }

        .flower__line__leaf--2 {
            top: 45%;
            transform: rotate(70deg) rotateY(30deg);
        }

        .flower__line__leaf--3,
        .flower__line__leaf--4,
        .flower__line__leaf--6 {
            border-top-right-radius: 0;
            border-bottom-left-radius: 0;
            border-top-left-radius: var(--h);
            border-bottom-right-radius: var(--h);
            left: -460%;
            top: 12%;
            transform: rotate(-70deg) rotateY(30deg);
        }

        .flower__line__leaf--4 {
            top: 40%;
        }

        .flower__line__leaf--5 {
            top: 0;
            transform-origin: left;
            transform: rotate(70deg) rotateY(30deg) scale(0.6);
        }

        .flower__line__leaf--6 {
            top: -2%;
            left: -450%;
            transform-origin: right;
            transform: rotate(-70deg) rotateY(30deg) scale(0.6);
        }

        .flower__light {
            position: absolute;
            bottom: 0vmin;
            width: 1vmin;
            height: 1vmin;
            background-color: rgb(255, 251, 0);
            border-radius: 50%;
            filter: blur(0.2vmin);
            animation: light-ans 4s linear infinite backwards;
        }

        .flower__light:nth-child(odd) {
            background-color: #ff7b9c;
        }

        .flower__light--1 {
            left: -2vmin;
            animation-delay: 1s;
        }

        .flower__light--2 {
            left: 3vmin;
            animation-delay: 0.5s;
        }

        .flower__light--3 {
            left: -6vmin;
            animation-delay: 0.3s;
        }

        .flower__light--4 {
            left: 6vmin;
            animation-delay: 0.9s;
        }

        .flower__light--5 {
            left: -1vmin;
            animation-delay: 1.5s;
        }

        .flower__light--6 {
            left: -4vmin;
            animation-delay: 3s;
        }

        .flower__light--7 {
            left: 3vmin;
            animation-delay: 2s;
        }

        .flower__light--8 {
            left: -6vmin;
            animation-delay: 3.5s;
        }

        .flower__grass {
            --c: #159faa;
            --line-w: 1.5vmin;

            position: absolute;
            bottom: 12vmin;
            left: -7vmin;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 20;
            transform-origin: bottom center;
            transform: rotate(-48deg) rotateY(40deg);
        }

        .flower__grass--1 {
            animation: moving-grass 2s linear infinite;
        }

        .flower__grass--2 {
            left: 2vmin;
            bottom: 10vmin;
            transform: scale(0.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);
            opacity: 0.8;
            z-index: 0;
            animation: moving-grass--2 1.5s linear infinite;
        }

        .flower__grass--top {
            width: 7vmin;
            height: 10vmin;
            border-top-right-radius: 100%;
            border-right: var(--line-w) solid var(--c);
            transform-origin: bottom center;
            transform: rotate(-2deg);
        }

        .flower__grass--bottom {
            margin-top: -2px;
            width: var(--line-w);
            height: 25vmin;
            background-image: linear-gradient(to top, transparent, var(--c));
        }

        .flower__grass__leaf {
            --size: 10vmin;
            position: absolute;
            width: calc(var(--size) * 2.1);
            height: var(--size);
            border-top-left-radius: var(--size);
            border-top-right-radius: var(--size);
            background-image: linear-gradient(
                to top,
                transparent,
                transparent 30%,
                var(--c)
            );
            z-index: 100;
        }

        .flower__grass__leaf--1 {
            top: -6%;
            left: 30%;
            --size: 6vmin;
            transform: rotate(-20deg);
            animation: growing-grass-ans--1 2s 2.6s backwards;
        }

        @keyframes growing-grass-ans--1 {
            0% {
                transform-origin: bottom left;
                transform: rotate(-20deg) scale(0);
            }
        }

        .flower__grass__leaf--2 {
            top: -5%;
            left: -110%;
            --size: 6vmin;
            transform: rotate(10deg);
            animation: growing-grass-ans--2 2s 2.4s linear backwards;
        }

        @keyframes growing-grass-ans--2 {
            0% {
                transform-origin: bottom right;
                transform: rotate(10deg) scale(0);
            }
        }

        .flower__grass__leaf--3 {
            top: 5%;
            left: 60%;
            --size: 8vmin;
            transform: rotate(-18deg) rotateX(-20deg);
            animation: growing-grass-ans--3 2s 2.2s linear backwards;
        }

        @keyframes growing-grass-ans--3 {
            0% {
                transform-origin: bottom left;
                transform: rotate(-18deg) rotateX(-20deg) scale(0);
            }
        }

        .flower__grass__leaf--4 {
            top: 6%;
            left: -135%;
            --size: 8vmin;
            transform: rotate(2deg);
            animation: growing-grass-ans--4 2s 2s linear backwards;
        }

        @keyframes growing-grass-ans--4 {
            0% {
                transform-origin: bottom right;
                transform: rotate(2deg) scale(0);
            }
        }

        .flower__grass__leaf--5 {
            top: 20%;
            left: 60%;
            --size: 10vmin;
            transform: rotate(-24deg) rotateX(-20deg);
            animation: growing-grass-ans--5 2s 1.8s linear backwards;
        }

        @keyframes growing-grass-ans--5 {
            0% {
                transform-origin: bottom left;
                transform: rotate(-24deg) rotateX(-20deg) scale(0);
            }
        }

        .flower__grass__leaf--6 {
            top: 22%;
            left: -180%;
            --size: 10vmin;
            transform: rotate(10deg);
            animation: growing-grass-ans--6 2s 1.6s linear backwards;
        }

        @keyframes growing-grass-ans--6 {
            0% {
                transform-origin: bottom right;
                transform: rotate(10deg) scale(0);
            }
        }

        .flower__grass__leaf--7 {
            top: 39%;
            left: 70%;
            --size: 10vmin;
            transform: rotate(-10deg);
            animation: growing-grass-ans--7 2s 1.4s linear backwards;
        }

        @keyframes growing-grass-ans--7 {
            0% {
                transform-origin: bottom left;
                transform: rotate(-10deg) scale(0);
            }
        }

        .flower__grass__leaf--8 {
            top: 40%;
            left: -215%;
            --size: 11vmin;
            transform: rotate(10deg);
            animation: growing-grass-ans--8 2s 1.2s linear backwards;
        }

        @keyframes growing-grass-ans--8 {
            0% {
                transform-origin: bottom right;
                transform: rotate(10deg) scale(0);
            }
        }

        .flower__grass__overlay {
            position: absolute;
            top: -10%;
            right: 0%;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            filter: blur(1.5vmin);
            z-index: 100;
        }

        .flower__g-long {
            --w: 2vmin;
            --h: 6vmin;
            --c: #159faa;
            position: absolute;
            bottom: 10vmin;
            left: -3vmin;
            transform-origin: bottom center;
            transform: rotate(-30deg) rotateY(-20deg);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            animation: flower-g-long-ans 3s linear infinite;
        }

        @keyframes flower-g-long-ans {
            0%, 100% {
                transform: rotate(-30deg) rotateY(-20deg);
            }
            50% {
                transform: rotate(-32deg) rotateY(-20deg);
            }
        }

        .flower__g-long__top {
            top: calc(var(--h) * -1);
            width: calc(var(--w) + 1vmin);
            height: var(--h);
            border-top-right-radius: 100%;
            border-right: 0.7vmin solid var(--c);
            transform: translate(-0.7vmin, 1vmin);
        }

        .flower__g-long__bottom {
            width: var(--w);
            height: 50vmin;
            transform-origin: bottom center;
            background-image: linear-gradient(to top, transparent 30%, var(--c));
            box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
            clip-path: polygon(35% 0, 65% 1%, 100% 100%, 0% 100%);
        }

        .flower__g-right {
            position: absolute;
            bottom: 6vmin;
            left: -2vmin;
            transform-origin: bottom left;
            transform: rotate(20deg);
        }

        .flower__g-right .leaf {
            width: 30vmin;
            height: 50vmin;
            border-top-left-radius: 100%;
            border-left: 2vmin solid #079097;
            background-image: linear-gradient(
                to bottom,
                transparent,
                var(--dark-color) 60%
            );
            -webkit-mask-image: linear-gradient(to top, transparent 30%, #079097 60%);
        }

        .flower__g-right--1 {
            animation: flower-g-right-ans 2.5s linear infinite;
        }

        .flower__g-right--2 {
            left: 5vmin;
            transform: rotateY(-180deg);
            animation: flower-g-right-ans--2 3s linear infinite;
        }

        .flower__g-right--2 .leaf {
            height: 75vmin;
            filter: blur(0.3vmin);
            opacity: 0.8;
        }

        @keyframes flower-g-right-ans {
            0%, 100% {
                transform: rotate(20deg);
            }
            50% {
                transform: rotate(24deg) rotateX(-20deg);
            }
        }

        @keyframes flower-g-right-ans--2 {
            0%, 100% {
                transform: rotateY(-180deg) rotate(0deg) rotateX(-20deg);
            }
            50% {
                transform: rotateY(-180deg) rotate(6deg) rotateX(-20deg);
            }
        }

        .flower__g-front {
            position: absolute;
            bottom: 6vmin;
            left: 2.5vmin;
            z-index: 100;
            transform-origin: bottom center;
            transform: rotate(-28deg) rotateY(30deg) scale(1.04);
            animation: flower__g-front-ans 2s linear infinite;
        }

        @keyframes flower__g-front-ans {
            0%, 100% {
                transform: rotate(-28deg) rotateY(30deg) scale(1.04);
            }
            50% {
                transform: rotate(-35deg) rotateY(40deg) scale(1.04);
            }
        }

        .flower__g-front__line {
            width: 0.3vmin;
            height: 20vmin;
            background-image: linear-gradient(
                to top,
                transparent,
                #079097,
                transparent 100%
            );
            position: relative;
        }

        .flower__g-front__leaf-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: bottom left;
            transform: rotate(10deg);
        }

        .flower__g-front__leaf-wrapper:nth-child(even) {
            left: 0vmin;
            transform: rotateY(-180deg) rotate(5deg);
            animation: flower__g-front__leaf-left-ans 1s ease-in backwards;
        }

        .flower__g-front__leaf-wrapper:nth-child(odd) {
            animation: flower__g-front__leaf-ans 1s ease-in backwards;
        }

        .flower__g-front__leaf-wrapper--1 {
            top: -8vmin;
            transform: scale(0.7);
            animation: flower__g-front__leaf-ans 1s 5.5s ease-in backwards !important;
        }

        .flower__g-front__leaf-wrapper--2 {
            top: -8vmin;
            transform: rotateY(-180deg) scale(0.7) !important;
            animation: flower__g-front__leaf-left-ans-2 1s 4.6s ease-in backwards !important;
        }

        .flower__g-front__leaf-wrapper--3 {
            top: -3vmin;
            animation: flower__g-front__leaf-ans 1s 4.6s ease-in backwards;
        }

        .flower__g-front__leaf-wrapper--4 {
            top: -3vmin;
            transform: rotateY(-180deg) scale(0.9) !important;
            animation: flower__g-front__leaf-left-ans-2 1s 4.6s ease-in backwards !important;
        }

        @keyframes flower__g-front__leaf-left-ans-2 {
            0% {
                transform: rotateY(-180deg) scale(0);
            }
        }

        .flower__g-front__leaf-wrapper--5,
        .flower__g-front__leaf-wrapper--6 {
            top: 2vmin;
        }

        .flower__g-front__leaf-wrapper--7,
        .flower__g-front__leaf-wrapper--8 {
            top: 6.5vmin;
        }

        .flower__g-front__leaf-wrapper--2 {
            animation-delay: 5.2s !important;
        }

        .flower__g-front__leaf-wrapper--3 {
            animation-delay: 4.9s !important;
        }

        .flower__g-front__leaf-wrapper--5 {
            animation-delay: 4.3s !important;
        }

        .flower__g-front__leaf-wrapper--6 {
            animation-delay: 4.1s !important;
        }

        .flower__g-front__leaf-wrapper--7 {
            animation-delay: 3.8s !important;
        }

        .flower__g-front__leaf-wrapper--8 {
            animation-delay: 3.5s !important;
        }

        @keyframes flower__g-front__leaf-ans {
            0% {
                transform: rotate(10deg) scale(0);
            }
        }

        @keyframes flower__g-front__leaf-left-ans {
            0% {
                transform: rotateY(-180deg) rotate(5deg) scale(0);
            }
        }

        .flower__g-front__leaf {
            width: 10vmin;
            height: 10vmin;
            border-radius: 100% 0% 0% 100% / 100% 100% 0% 0%;
            box-shadow: inset 0 2px 1vmin hsla(184, 97%, 58%, 0.2);
            background-image: linear-gradient(
                to bottom left,
                transparent,
                var(--dark-color)
            ),
            linear-gradient(
                to bottom right,
                #159faa 50%,
                transparent 50%,
                transparent
            );

            -webkit-mask-image: linear-gradient(
                to bottom right,
                #159faa 50%,
                transparent 50%,
                transparent
            );
            mask-image: linear-gradient(
                to bottom right,
                #159faa 50%,
                transparent 50%,
                transparent
            );
        }

        .flower__g-fr {
            position: absolute;
            bottom: -4vmin;
            left: 0vmin;
            transform-origin: bottom left;
            z-index: 10;
            animation: flower__g-fr-ans 2s linear infinite;
        }

        @keyframes flower__g-fr-ans {
            0%, 100% {
                transform: rotate(2deg);
            }
            50% {
                transform: rotate(4deg);
            }
        }

        .flower__g-fr .leaf {
            width: 30vmin;
            height: 50vmin;
            border-top-left-radius: 100%;
            border-left: 2vmin solid #079097;
            -webkit-mask-image: linear-gradient(to top, transparent 25%, #079097 50%);
            position: relative;

        /* =========================================================
           TWO CATS GROW THE GARDEN
           Every growth animation above is held on its first frame
           (invisible) until the story below releases it with .on,
           so nothing grows before a cat touches its spot.
           ========================================================= */
        @property --fur { syntax: '<number>'; inherits: true; initial-value: 0; }
        @property --rim { syntax: '<number>'; inherits: true; initial-value: 0; }

        .armed .cue { animation-play-state: paused !important; animation-delay: 0s !important; }
        .armed .cue.on { animation-play-state: running !important; }

        .pink-flower-head { transition: filter 2.5s ease; }
        .bloomglow .pink-flower-head { filter: drop-shadow(0 0 1.3vmin rgba(255, 130, 165, .5)); }

        /* ---------- the cats ---------- */
        .cat { position: absolute; left: 0; z-index: 30; transform-origin: 50% 100%; will-change: transform; }
        .cat-svg { width: 100%; height: 100%; display: block; overflow: visible; transition: --fur 2.4s ease, --rim 2.4s ease; }
        .cat .fur { opacity: var(--fur); }
        .cat .rim { opacity: var(--rim); }
        .cat .glowfloor { opacity: calc(var(--rim) * .5); }
        .cat .eyes { opacity: 0; transition: opacity 1.4s ease; }
        .cat.eyes-on .eyes { opacity: 1; }
        .cat .eyeglow { opacity: .85; transition: opacity 3s; }
        .cat.lit .eyeglow { opacity: .35; }
        .cat.meh .eyeglow { opacity: 0; transition: opacity .3s; }
        .cat .rig, .cat .leg, .cat .tail, .cat .head, .cat .mouth-seed { transform-box: view-box; }
        .cat .rig { transform-origin: 110px 158px; transition: transform .9s ease; }
        .cat .leg { transition: transform .35s ease; }
        .cat .leg.fn { transform-origin: 151px 102px; }
        .cat .leg.ff { transform-origin: 141px 102px; }
        .cat .leg.bn { transform-origin: 70px 100px; }
        .cat .leg.bf { transform-origin: 80px 100px; }
        .cat .tail { transform-origin: 62px 94px; animation: cat-tail 3.2s ease-in-out infinite alternate; }
        .cat--b .tail { animation-duration: .85s; }
        @keyframes cat-tail { from { transform: rotate(-7deg); } to { transform: rotate(9deg); } }
        .cat .head { transform-origin: 168px 76px; transition: transform .6s cubic-bezier(.3, 1.3, .5, 1); }
        .cat.look-up .head { transform: rotate(-24deg); }
        .cat.look-down .head { transform: rotate(22deg); }
        .cat.tilt .head { transform: rotate(-9deg); }
        .cat.tilt-b .head { transform: rotate(11deg); }

        /* walking */
        .cat--a { --step: .5s; }
        .cat--b { --step: .28s; }
        .cat.walking .leg.fn, .cat.walking .leg.bf { animation: cat-step var(--step) ease-in-out infinite alternate; }
        .cat.walking .leg.ff, .cat.walking .leg.bn { animation: cat-step var(--step) ease-in-out infinite alternate-reverse; }
        .cat.walking.backing .leg { animation-direction: alternate-reverse; }
        @keyframes cat-step { from { transform: rotate(-19deg); } to { transform: rotate(17deg); } }
        .cat.walking .rig { animation: cat-bob var(--step) ease-in-out infinite alternate; }
        .cat--b.walking .rig { animation-name: cat-bounce; }
        @keyframes cat-bob { from { transform: translateY(0); } to { transform: translateY(-2.5px); } }
        @keyframes cat-bounce { from { transform: translateY(0); } to { transform: translateY(-6px); } }

        /* eyes, ears, lids */
        .cat .lid { transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); animation: cat-blink 5.2s infinite; }
        .cat--b .lid { animation-duration: 3.3s; animation-delay: -1s; }
        @keyframes cat-blink { 0%, 93%, 100% { transform: scaleY(0); } 96% { transform: scaleY(1); } }
        .cat.meh .lid { animation: none; transform: scaleY(1); transition: transform .45s ease; }
        .cat .pupil { transform-box: fill-box; transform-origin: center; transition: transform .35s ease; }
        .cat.wide .pupil { transform: scaleX(2.6); }
        .cat .ear { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .4s ease; }
        .cat--b .ear.near { animation: cat-twitch 4.6s infinite; }
        @keyframes cat-twitch { 0%, 90%, 100% { transform: none; } 93% { transform: rotate(-14deg); } 96% { transform: rotate(5deg); } }
        .cat.ears-back .ear { animation: none; transform: rotate(-26deg) scaleY(.8); }
        .cat .mouth-seed { transition: opacity .2s; }
        .cat .mouth-seed .seedglow { opacity: .15; transition: opacity 2s; }
        .cat.seed-bright .mouth-seed .seedglow { opacity: .55; }

        /* settled: lying down, paws tucked */
        .cat.lying .rig { transform: translateY(38px); }
        .cat.lying .leg { animation: none !important; transform: scaleY(.18); }

        .fx { position: absolute; left: 0; bottom: 0; pointer-events: none; z-index: 45; }
        .fx.seed { width: 1.6vmin; height: 1.1vmin; margin: 0 0 -.55vmin -.8vmin; border-radius: 50%;

        .fx.dirt { width: .7vmin; height: .6vmin; margin: 0 0 -.3vmin -.35vmin; border-radius: 45%; background: #6e4b2e; box-shadow: 0 0 .5vmin rgba(255, 196, 120, .3); }

        .fx.puff { width: 3.2vmin; height: 1.1vmin; margin: 0 0 -.55vmin -1.6vmin; border-radius: 50%; border: .25vmin solid rgba(120, 230, 240, .75); box-shadow: 0 0 1vmin rgba(57, 198, 214, .6); }
        .fx.pulse { width: 1.8vmin; height: 1.8vmin; margin: 0 0 -.9vmin -.9vmin; border-radius: 50%;
            background: radial-gradient(circle, #fffbe0, #ffe27a 38%, rgba(255, 160, 190, 0) 72%);

        .fx.mote { width: 1.3vmin; height: 1.3vmin; margin: 0 0 -.65vmin -.65vmin; border-radius: 50%;
            background: radial-gradient(circle, #fffde6, #fff27a 45%, rgba(255, 230, 120, 0) 72%);

        .mist { position: absolute; left: -75vmin; width: 150vmin; bottom: -5vmin; height: 15vmin; pointer-events: none; z-index: 4;
            background: radial-gradient(ellipse at 50% 60%, rgba(57, 198, 214, .15), transparent 70%); opacity: 0; transition: opacity 3.5s ease; }
        .mist.on { opacity: 1; }

        /* ---------- the birthday message & replay ---------- */
        .bday { position: fixed; top: 4.5vh; left: 0; right: 0; z-index: 1000; text-align: center; pointer-events: none; padding: 0 20px;
            opacity: 0; transform: translateY(8px); transition: opacity 2.6s ease, transform 2.6s ease; }
        .bday.on { opacity: 1; transform: none; }
        .bday h1 { margin: 0; font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; font-weight: normal; font-style: italic;
            font-size: clamp(22px, 5vmin, 56px); letter-spacing: .04em; color: #fff3f6;
            text-shadow: 0 0 18px rgba(255, 123, 156, .55), 0 0 44px rgba(255, 83, 123, .3); }
        .bday p { margin: .55em 0 0; font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; font-size: clamp(13px, 2.2vmin, 22px);
            letter-spacing: .05em; color: rgba(255, 216, 228, .82); text-shadow: 0 0 12px rgba(0, 0, 0, .9); }
        .replay { position: fixed; right: 18px; bottom: 14px; z-index: 1000; display: flex; align-items: center; gap: 7px;
            padding: 6px 14px 6px 11px; border-radius: 20px; border: 1px solid rgba(255, 220, 232, .2); background: rgba(0, 0, 0, .35);
            color: rgba(255, 228, 236, .75); font: italic 14px 'Palatino Linotype', 'Book Antiqua', Georgia, serif; cursor: pointer;
            opacity: 0; pointer-events: none; transition: opacity 1.6s ease, border-color .3s, color .3s; }
        .replay.on { opacity: .75; pointer-events: auto; }
        .replay:hover, .replay:focus-visible { opacity: 1; color: #fff; border-color: rgba(255, 150, 185, .6); outline: none; }
        .replay svg { width: 15px; height: 15px; }

        /* ---------- reduced motion: a calm, complete reveal ---------- */
        .rm .cue { animation-duration: 1ms !important; }
        .rm *:not(.cue) { animation: none !important; }
        .rm > :not(.cat) { transition: opacity 2.6s ease; }
        .garden-hidden > :not(.cat) { opacity: 0; }

        /* keep the garden hidden until the story has taken control of it */
        body:not(.started) .flowers { visibility: hidden; }

    <script>
    (() => {
        /* =====================================================
           EDIT THE FINAL BIRTHDAY MESSAGE HERE
           ===================================================== */
        const MESSAGE = {
            title: 'Happy Birthday, Anne',
            line: 'May everything you plant this year bloom beautifully.'
        };

        /* ---------------- set-up ---------------- */
        const flowers = document.querySelector('.flowers');
        const TEMPLATE = flowers.innerHTML;          // pristine garden, used for Replay
        const bday = document.querySelector('.bday');
        const replayBtn = document.querySelector('.replay');
        const hearts = document.getElementById('faded-hearts-container');
        // reduced motion follows the system setting (add #reduced to the address to preview it)
        const reduced = (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || location.hash === '#reduced';
        bday.querySelector('h1').textContent = MESSAGE.title;
        bday.querySelector('p').textContent = MESSAGE.line;

        const G = 4;                                  // the ground line, in the garden's own units
        const STOP = {};
        let live = 0, heartTimer = 0;

        // every part of the garden that grows, held until a cat releases it
        const CUES = ['.flower__line', '.flower__line__leaf', '.flower__leafs', '.flower__light', '.grow-ans',
            '.growing-grass', '.flower__grass__leaf', '.flower__g-front__leaf-wrapper', '.flower__g-fr__leaf'];

        const T = (x, y) => `translate(${x.toFixed(2)}vmin, ${(-y).toFixed(2)}vmin)`;
        const on = el => { if (el) el.classList.add('on'); };
        const q = s => flowers.querySelector(s);
        const cascade = (els, step) => [...els].forEach((e, i) => setTimeout(() => on(e), i * step));
        const tuft = sel => { const g = q(sel); if (g) cascade(g.querySelectorAll('.grow-ans'), 150); };
        function fx(cls, x, y) {
            const d = document.createElement('div');
            d.className = 'fx ' + cls;
            d.style.transform = T(x, y);
            flowers.appendChild(d);
            return d;
        }
        function puff(x) {
            const p = fx('puff', x, G);
            p.animate([{ transform: T(x, G) + ' scale(.3)', opacity: 1 }, { transform: T(x, G) + ' scale(1.6)', opacity: 0 }],
                { duration: 700, easing: 'ease-out', fill: 'forwards' }).onfinish = () => p.remove();
        }

        /* ---------------- the cats ---------------- */
        const CATS = {
            // the careful one: a sleek tuxedo cat who carries the seed
            a: { size: 22, fur: ['#50545f', '#2d3039', '#15161b'], light: '#eef0f2', eye: ['#ecffb8', '#9bdc54', '#35601a'],
                rim: '#86e8f2', nose: '#d99aa0', tux: true, seed: true },
            // the chaotic helper: a round ginger tabby with a leaf stuck to its tail
            b: { size: 20, fur: ['#f7ba74', '#d8843c', '#9a4d1b'], light: '#f8e3c2', eye: ['#fff5b8', '#ffc53f', '#a85a08'],
                rim: '#ffa2c0', nose: '#e8938e', tabby: true, leaf: true }
        };

        function catSVG(k, c) {
            const id = 'cat' + k, fur = `url(#${id}-fur)`, dark = c.fur[2];
            const BODY = 'M58 100C54 76 84 64 120 66C148 68 166 74 168 94C170 114 140 122 104 121C76 120 60 116 58 100Z';
            const NECK = 'M148 76C154 62 170 58 180 66L178 96C166 102 150 96 148 76Z';
            const HEAD = 'M156 58C154 38 168 28 182 29C198 30 208 42 206 58C204 72 192 80 180 80C166 80 158 72 156 58Z';
            const FLEG = 'M144 100C142 122 142 142 143 154L156 154C157 142 157 122 159 100Z';
            const BLEG = 'M62 96C50 110 55 130 63 141L59 154L72 154L78 138C85 124 85 108 81 98Z';
            const paw = (x, col) => `<ellipse cx="${x}" cy="156" rx="8.5" ry="4.2" fill="${col}"/>`;
            const nearPaw = c.tux ? c.light : c.fur[0];
            return `<svg class="cat-svg" viewBox="0 0 220 170" aria-hidden="true">
              <defs>
                <linearGradient id="${id}-fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.fur[0]}"/><stop offset=".55" stop-color="${c.fur[1]}"/><stop offset="1" stop-color="${c.fur[2]}"/></linearGradient>
                <radialGradient id="${id}-headg" cx=".62" cy=".35" r=".75"><stop offset="0" stop-color="${c.fur[0]}"/><stop offset=".6" stop-color="${c.fur[1]}"/><stop offset="1" stop-color="${c.fur[2]}"/></radialGradient>
                <radialGradient id="${id}-eye" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="${c.eye[0]}"/><stop offset=".45" stop-color="${c.eye[1]}"/><stop offset="1" stop-color="${c.eye[2]}"/></radialGradient>
                <linearGradient id="${id}-leaf" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#14757a"/><stop offset="1" stop-color="#39c6d6"/></linearGradient>
                <filter id="${id}-fuzz" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="${k === 'a' ? 3 : 7}"/><feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
                <filter id="${id}-glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3.4"/></filter>
                <filter id="${id}-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
              </defs>
              <ellipse class="glowfloor" cx="108" cy="158" rx="70" ry="7" fill="${c.rim}" filter="url(#${id}-soft)"/>
              <g class="rig">
                <g class="fur" filter="url(#${id}-fuzz)">
                  <g class="tail">
                    <path d="M62 94C38 92 22 74 28 52C31 42 41 36 46 42" fill="none" stroke="${fur}" stroke-width="${c.tabby ? 12 : 9}" stroke-linecap="round"/>
                    ${c.tabby ? `<path d="M40 84L48 78M30 68L39 66M28 55L37 57" stroke="${dark}" stroke-width="3.2" stroke-linecap="round" opacity=".6"/>` : ''}
                    ${c.leaf ? `<g transform="translate(44 40) rotate(-35)"><path d="M0 0C5 -9 17 -12 25 -6C17 3 6 4 0 0Z" fill="url(#${id}-leaf)"/><path d="M0 0L21 -6" stroke="#0e6166" stroke-width=".9"/></g>` : ''}
                  </g>
                  <g class="leg bf"><path d="${BLEG}" transform="translate(10 0)" fill="${dark}"/>${paw(75.5, c.tux ? '#c9ccd1' : dark)}</g>
                  <g class="leg ff"><path d="${FLEG}" transform="translate(-10 0)" fill="${dark}"/>${paw(139.5, c.tux ? '#c9ccd1' : dark)}</g>
                  <path d="${BODY}" fill="${fur}"/>
                  ${c.tabby ? `<path d="M92 118C112 124 146 120 160 108C150 114 118 118 92 118Z" fill="${c.light}" opacity=".85"/>
                    <g stroke="${dark}" stroke-width="4.5" stroke-linecap="round" fill="none" opacity=".55"><path d="M90 69C93 75 94 80 91 86M106 67C109 73 110 79 107 85M122 67C125 73 126 79 123 85M138 69C140 74 141 79 138 84"/></g>` : ''}
                  <path d="${NECK}" fill="${fur}"/>
                  <path d="M150 78C162 84 166 102 160 116C152 110 146 94 150 78Z" fill="${c.light}" opacity="${c.tux ? .95 : .8}"/>
                  <g class="leg bn"><path d="${BLEG}" fill="${fur}"/>${paw(65.5, c.tux ? c.light : c.fur[0])}</g>
                  <g class="leg fn"><path d="${FLEG}" fill="${fur}"/>${paw(149.5, nearPaw)}</g>
                  <g class="head">
                    <g class="ear far"><path d="M188 32L201 12L206 42Z" fill="${c.fur[1]}"/><path d="M192 32L200 19L203 38Z" fill="#d98a92" opacity=".55"/></g>
                    <g class="ear near"><path d="M158 42L160 13L181 31Z" fill="${fur}"/><path d="M163 37L164 21L175 31Z" fill="#e39aa2" opacity=".6"/></g>
                    <path d="${HEAD}" fill="url(#${id}-headg)"/>
                    ${c.tabby ? `<g stroke="${dark}" stroke-width="3" stroke-linecap="round" opacity=".6"><path d="M176 33L178 41M184 31L184 40M192 33L190 41"/><path d="M160 60L168 62M161 67L169 67"/></g>
                      <path d="M158 66C156 74 160 80 166 80C162 76 161 71 162 66Z" fill="${c.fur[0]}"/>` : ''}
                    <ellipse cx="196" cy="66" rx="${c.tux ? 11 : 10}" ry="7.8" fill="${c.light}" opacity="${c.tux ? .95 : .85}"/>
                    <path d="M200 60L206.5 60L203.2 64.5Z" fill="${c.nose}"/>
                    <path d="M203.2 64.5Q202 69 198 70M203.2 64.5Q205 69 208.5 69" stroke="#3a2a2a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
                    <g stroke="#fff" stroke-width=".8" opacity=".55" fill="none"><path d="M196 67L178 62M196 69L177 70M206 66L222 61M206 68L223 69"/></g>
                  </g>
                  <g class="rim" fill="none" stroke="${c.rim}" stroke-linecap="round">
                    <path d="M64 86C76 70 110 64 146 68" stroke-width="1.8"/>
                    <path d="M160 40C168 30 190 27 203 40" stroke-width="1.6"/>
                    <path d="M30 60C28 50 36 40 44 41" stroke-width="1.4"/>
                  </g>
                </g>
                <g class="head eyes">
                  <g class="eyeglow" filter="url(#${id}-glow)"><ellipse cx="180" cy="53" rx="8" ry="7" fill="${c.eye[1]}"/><ellipse cx="197" cy="51" rx="6" ry="6.2" fill="${c.eye[1]}"/></g>
                  <ellipse cx="180" cy="53" rx="6.2" ry="5.2" fill="url(#${id}-eye)"/>
                  <ellipse class="pupil" cx="181" cy="53" rx="1.5" ry="4.3" fill="#0b0b0b"/>
                  <circle cx="182.6" cy="50.6" r="1.4" fill="#fff" opacity=".9"/>
                  <ellipse cx="197" cy="51" rx="4.4" ry="4.8" fill="url(#${id}-eye)"/>
                  <ellipse class="pupil" cx="197.6" cy="51" rx="1.2" ry="3.9" fill="#0b0b0b"/>
                  <circle cx="198.6" cy="49" r="1.1" fill="#fff" opacity=".85"/>
                  <ellipse class="lid" cx="180" cy="52.5" rx="7.2" ry="6.2" fill="${dark}"/>
                  <ellipse class="lid" cx="197" cy="50.5" rx="5.4" ry="5.8" fill="${dark}"/>
                  ${c.seed ? `<g class="mouth-seed"><circle class="seedglow" cx="205" cy="72" r="10" fill="#ffd66b" filter="url(#${id}-glow)"/>
                    <ellipse cx="205" cy="72" rx="4.2" ry="2.8" fill="#ffe08a" stroke="#c98a1c" stroke-width=".8"/></g>` : ''}
                </g>
              </g>
            </svg>`;
        }

        class Cat {
            constructor(k, W) {
                const c = CATS[k];
                this.W = W; this.size = c.size; this.u = c.size / 220; this.dir = 1; this.cx = 0;
                this.el = document.createElement('div');
                this.el.className = 'cat cat--' + k;
                this.el.innerHTML = catSVG(k, c);
                const h = c.size * 170 / 220;
                Object.assign(this.el.style, { width: c.size + 'vmin', height: h + 'vmin', bottom: (G - c.size * 10 / 220) + 'vmin' });
                flowers.appendChild(this.el);
                this.svg = this.el.querySelector('.cat-svg');
                this.rig = this.el.querySelector('.rig');
                this.pawOff = 39.5 * this.u;      // front paw, from the cat's centre
                this.mouthOff = 95 * this.u;      // mouth / seed
                this.mouthY = 85 * this.u;
                this.noseOff = 96 * this.u;
            }
            q(s) { return this.el.querySelector(s); }
            apply() { this.el.style.transform = `translateX(${(this.cx - this.size / 2).toFixed(2)}vmin) scaleX(${this.dir})`; }
            place(cx, dir) { this.cx = cx; if (dir) this.dir = dir; this.el.style.transition = 'none'; this.apply(); }
            light(f, r) { this.svg.style.setProperty('--fur', f); this.svg.style.setProperty('--rim', r); }
            eyes(v) { this.el.classList.toggle('eyes-on', v); }
            state(...names) {
                ['look-up', 'look-down', 'tilt', 'tilt-b'].forEach(n => this.el.classList.remove(n));
                names.forEach(n => n && this.el.classList.add(n));
            }
            flag(name, v) { this.el.classList.toggle(name, v); }
            pawX() { return this.cx + this.dir * this.pawOff; }
            headTop() { return { x: this.cx + this.dir * 72 * this.u, y: G + 128 * this.u }; }
            async turn(dir) {
                if (dir === this.dir) return;
                this.dir = dir; this.el.style.transition = 'transform .32s ease-in-out'; this.apply();
                await this.W(340);
            }
            async walk(cx, speed, keepFacing) {
                const d = Math.abs(cx - this.cx); if (d < .05) return;
                const dir = cx > this.cx ? 1 : -1;
                if (!keepFacing) await this.turn(dir);
                const ms = d / speed * 1000;
                this.el.classList.add('walking');
                if (dir !== this.dir) this.el.classList.add('backing');
                this.el.style.transition = `transform ${ms}ms linear`;
                this.cx = cx; this.apply();
                await this.W(ms);
                this.el.classList.remove('walking', 'backing');
            }
            // walk so the front paw lands on x
            async walkPawTo(x, speed, max) {
                const dir = x > this.cx ? 1 : -1;
                let cx = x - dir * this.pawOff;
                if (max) cx = Math.max(-max, Math.min(max, cx));
                await this.walk(cx, speed);
            }
            blink() { this.el.querySelectorAll('.lid').forEach(l => l.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }, { transform: 'scaleY(0)' }], { duration: 220 })); }
            async slowBlink() { this.flag('meh', true); await this.W(900); this.flag('meh', false); }
            // a gentle tap; resolves the moment the paw touches the ground
            async pat(power = 1) {
                const leg = this.q('.leg.fn'), d = power > 1 ? 380 : 480;
                this.rig.animate([{ transform: 'rotate(0deg)' }, { transform: `rotate(${3 + 3 * power}deg)`, offset: .5 }, { transform: 'rotate(0deg)' }], { duration: d });
                leg.animate([{ transform: 'rotate(0deg)' }, { transform: `rotate(${-38 - 16 * power}deg)`, offset: .45 }, { transform: 'rotate(3deg)', offset: .85 }, { transform: 'rotate(0deg)' }],
                    { duration: d, easing: 'ease-in-out' });
                await this.W(d * .85);
                puff(this.pawX());
                await this.W(d * .15 + 90);
            }
            async dig(target) {
                const leg = this.q('.leg.fn');
                this.rig.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(8deg)' }, { transform: 'rotate(0deg)' }], { duration: 250 });
                leg.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(-62deg)', offset: .4 }, { transform: 'rotate(24deg)', offset: .8 }, { transform: 'rotate(0deg)' }], { duration: 250 });
                await this.W(190);
                spray(this.pawX(), -this.dir, target);
                await this.W(80);
            }
            async boop() {
                this.state('look-down');
                this.rig.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(11px,3px) rotate(5deg)', offset: .5 }, { transform: 'translate(0,0)' }], { duration: 950, easing: 'ease-in-out' });
                await this.W(470);
            }
            async hop() {
                await this.rig.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-16px)' }, { transform: 'translateY(0)' }], { duration: 380, easing: 'ease-out' }).finished;
            }
            async bat() {
                const leg = this.q('.leg.fn');
                this.rig.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(6px,-48px) rotate(-11deg)', offset: .45 }, { transform: 'translate(0,0)' }], { duration: 820, easing: 'ease-in-out' });
                leg.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(-140deg)', offset: .45 }, { transform: 'rotate(-40deg)', offset: .6 }, { transform: 'rotate(0deg)' }], { duration: 820 });
                await this.W(370);
            }
            async shake() {
                const k = [0, -13, 12, -11, 9, -5, 0].map(a => ({ transform: `rotate(${a}deg)` }));
                this.el.querySelectorAll('.head').forEach(h => h.animate(k, { duration: 650 }));
                await this.W(650);
            }
            lie(v) { this.flag('lying', v); }
        }

        /* ---------------- scene effects ---------------- */
        let clumps = [];
        function spray(x, dir, target) {
            for (let i = 0; i < 7; i++) {
                const d = fx('dirt', x, G + .3);
                const dx = dir * (2 + Math.random() * 7), up = 3 + Math.random() * 6;
                d.animate([{ transform: T(x, G + .3), opacity: 1 }, { transform: T(x + dx * .5, G + up), opacity: 1, offset: .45 }, { transform: T(x + dx, G), opacity: 0 }],
                    { duration: 520 + Math.random() * 240, easing: 'ease-out', fill: 'forwards' }).onfinish = () => d.remove();
            }
            if (target) {                       // ...and a few clumps fly the wrong way
                const h = target.headTop();
                for (let i = 0; i < 3; i++) {
                    const c = fx('clump', x, G + .5), ex = h.x + (i - 1) * 1.1, ey = h.y + (i === 1 ? .6 : 0);
                    c.animate([{ transform: T(x, G + .5) }, { transform: T((x + ex) / 2, Math.max(ey, G) + 9 + i), offset: .5 }, { transform: T(ex, ey) }],
                        { duration: 620 + i * 70, easing: 'ease-in-out', fill: 'forwards' });
                    clumps.push({ el: c, x: ex, y: ey });
                }
            }
        }
        function dropClumps() {
            clumps.forEach(({ el, x, y }, i) => {
                el.animate([{ transform: T(x, y) }, { transform: T(x + (i - 1) * 3, y + 2) , offset: .25 }, { transform: T(x + (i - 1) * 4.5, G + .2), opacity: 1, offset: .8 }, { transform: T(x + (i - 1) * 4.5, G + .2), opacity: 0 }],
                    { duration: 900, easing: 'ease-in', fill: 'forwards' }).onfinish = () => el.remove();
            });
            clumps = [];
        }
        async function dropSeed(cat, W) {
            cat.q('.mouth-seed').style.opacity = '0';
            const x0 = cat.cx + cat.dir * cat.mouthOff, y0 = G + cat.mouthY, tx = .75, ty = G + .5;
            const seed = fx('seed', x0, y0);
            await seed.animate([{ transform: T(x0, y0) }, { transform: T((x0 + tx) / 2, y0 + 1.2), offset: .25 }, { transform: T(tx, ty) }],
                { duration: 620, easing: 'cubic-bezier(.45,0,.9,.55)', fill: 'forwards' }).finished;
            await seed.animate([{ transform: T(tx, ty) }, { transform: T(tx + .2, ty + 1.1) }, { transform: T(tx + .3, ty - .2) }],
                { duration: 300, easing: 'ease-out', fill: 'forwards' }).finished;
            seed.classList.add('planted');
            await W(200);
            return seed;
        }

        // the stems: [height, average lean]; leaves sit this far down from the top of their stem
        const STEMS = { 1: { L: 70, a: 0 }, 2: { L: 60, a: 16 }, 3: { L: 55, a: -19 } };
        const LEAF_TOP = [.20, .45, .12, .40, 0, -.02];
        async function pulse(n, dur, W) {
            const { L, a } = STEMS[n], r = a * Math.PI / 180;
            const bx = .75, by = G, tx = bx + L * Math.sin(r), ty = by + L * Math.cos(r);
            const dot = fx('pulse', bx, by);
            dot.animate([{ transform: T(bx, by), opacity: 0 }, { transform: T(bx + (tx - bx) * .05, by + (ty - by) * .05), opacity: 1, offset: .05 }, { transform: T(tx, ty), opacity: 1 }],
                { duration: dur, easing: 'linear', fill: 'forwards' });
            // each leaf unfolds exactly when the light reaches it
            flowers.querySelectorAll(`.flower--${n} .flower__line__leaf`).forEach((leaf, i) =>
                setTimeout(() => on(leaf), dur * Math.min(1, 1 - LEAF_TOP[i])));
            await W(dur);
            on(q(`.flower--${n} .flower__leafs`));
            dot.animate([{ transform: T(tx, ty) + ' scale(1)', opacity: 1 }, { transform: T(tx, ty) + ' scale(6)', opacity: 0 }],
                { duration: 1100, easing: 'ease-out', fill: 'forwards' }).onfinish = () => dot.remove();
        }
        function growGrass(i) {
            const g = flowers.querySelectorAll('.growing-grass')[i]; if (!g) return;
            on(g); cascade([...g.querySelectorAll('.flower__grass__leaf')].reverse(), 120);
        }
        function growNear(sel, leafSel, step) {
            const el = q(sel); if (!el) return;
            const w = el.closest('.grow-ans'); on(w);
            if (leafSel) setTimeout(() => cascade([...w.querySelectorAll(leafSel)].reverse(), step || 110), 350);
        }
        function spawnHeart() {
            const heart = document.createElement('div');
            heart.className = 'faded-heart';
            heart.innerHTML = '<svg viewBox="0 0 32 32"><path d="M16 28.5 C16 28.5 3 19.5 3 11 C3 6.5 6.5 3 11 3 C13.8 3 15.3 4.5 16 5.5 C16.7 4.5 18.2 3 21 3 C25.5 3 29 6.5 29 11 C29 19.5 16 28.5 16 28.5 Z" /></svg>';
            heart.style.left = (innerWidth * .38 + Math.random() * innerWidth * .24) + 'px';
            heart.style.top = (innerHeight * .30 + Math.random() * innerHeight * .15) + 'px';
            hearts.appendChild(heart);
            setTimeout(() => heart.remove(), 5600);
        }

        /* ---------------- the story ---------------- */
        async function story(c1, c2, W) {
            const u = Math.min(innerWidth, innerHeight) / 100 * .9;
            const halfW = innerWidth / 2 / u;
            const edge = Math.max(30, halfW - 13);
            const reach = halfW - 11;                  // keep the cats on screen
            c1.place(-edge, 1); c2.place(edge, -1);

            // 1. darkness, then two pairs of eyes
            await W(1500);
            c1.eyes(true); await W(650); c1.blink(); await W(900);
            c2.eyes(true); await W(380); c2.blink(); await W(260); c2.blink(); await W(1000);

            // 2. they emerge: the careful one with the seed, the helper with a leaf on its tail
            c1.light(.3, .2); c2.light(.3, .2); c1.flag('seed-bright', true);
            await Promise.all([
                c1.walk(.75 - c1.mouthOff, 10),
                (async () => { await W(700); await c2.walk(15, 15); c2.state('tilt-b'); await W(500); c2.blink(); })()
            ]);

            // 3. the seed is placed... and the helper helps
            c1.state('look-down'); await W(600);
            const seed = await dropSeed(c1, W);
            c1.state(''); await W(350);
            await c1.walk(c1.cx - 8, 5, true);
            c1.state('tilt');
            c2.state(''); c2.flag('wide', true);
            await c2.walkPawTo(3.8, 11);
            c2.flag('wide', false);
            for (let i = 0; i < 5; i++) await c2.dig(i === 2 ? c1 : null);
            c1.state(''); c1.flag('meh', true);           // ...dirt, right on the careful one's head
            await W(800);
            c2.flag('ears-back', true); c2.state('tilt-b');
            await W(1000);
            await c1.shake(); dropClumps();
            await W(250); c1.flag('meh', false);
            await W(450); c2.flag('ears-back', false); c2.state('');

            // 4. the seed sprouts
            seed.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 2200, fill: 'forwards' });
            ['.flower--1', '.flower--3', '.flower--2'].forEach((s, i) => setTimeout(() => on(q(s + ' .flower__line')), i * 200));
            growNear('.flower__g-long');
            c2.flag('wide', true);
            await Promise.all([(async () => { await c2.hop(); await c2.walk(16, 13, true); })(), c1.walk(-15, 6, true)]);
            c1.state('look-up'); c2.state('look-up'); c2.flag('wide', false);
            c1.light(.5, .4); c2.light(.5, .4);
            await W(2600);
            c1.state(''); c2.state('');

            // every touch grows the garden right where it lands
            await Promise.all([
                (async () => {
                    await c1.walkPawTo(-15, 9); await c1.pat(); tuft('.long-g--3');
                    await W(500); c1.state('look-down'); await W(500); c1.state('');           // a small nudge
                    await c1.walkPawTo(-33, 9, reach); await c1.pat(); tuft('.long-g--2');
                    await c1.walkPawTo(-40, 9, reach); await c1.pat(); tuft('.long-g--1'); tuft('.long-g--0');
                    await W(300); await c1.turn(1); c1.state('tilt');
                })(),
                (async () => {
                    await W(300);
                    await c2.walkPawTo(27, 14, reach); await c2.pat(); await c2.pat(); tuft('.long-g--4');
                    await c2.walkPawTo(36, 14, reach); await c2.pat(); tuft('.long-g--7');
                    await c2.walkPawTo(44, 14, reach); await c2.pat(); tuft('.long-g--5');
                    await W(300); await c2.turn(-1); c2.state('tilt-b');
                })()
            ]);
            await W(500); c1.state(''); c2.state('');

            // around the young stems
            await c1.walkPawTo(-6, 10); await c1.pat(); growGrass(0);
            await c1.walkPawTo(-1.5, 8); await c1.pat(); growNear('.flower__g-right--1'); growNear('.flower__g-fr', '.flower__g-fr__leaf');
            await c1.walk(-17, 7, true);
            await c2.walkPawTo(3, 13); await c2.pat(); growNear('.flower__g-front', '.flower__g-front__leaf-wrapper');
            await c2.walkPawTo(6.5, 13); await c2.pat(); growGrass(1); growNear('.flower__g-right--2');
            await c2.walk(17, 11, true);
            c1.light(.75, .65); c2.light(.75, .65);
            q('.mist').classList.add('on');
            await W(700);

            // light climbs the stems: leaves unfold on the way, flowers bloom at the top
            await c1.walk(.9 - c1.noseOff, 8);
            await c1.boop();
            tuft('.long-g--6');
            const p3 = pulse(3, 1700, W);
            await W(450); const p1 = pulse(1, 2200, W);
            await W(500); c1.state('look-up');
            await c1.walk(-15, 7, true);
            await c2.walkPawTo(1.6, 13);
            await c2.pat(2);                                // a little too hard...
            const line2 = q('.flower--2 .flower__line');
            line2.style.transformOrigin = '50% 100%';
            line2.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(8deg)' }, { transform: 'rotate(-6deg)' }, { transform: 'rotate(3deg)' }, { transform: 'rotate(0deg)' }], { duration: 1200, easing: 'ease-out' });
            const p2 = pulse(2, 1900, W);
            c2.flag('wide', true); c2.flag('ears-back', true);
            await c2.hop(); await c2.walk(15, 12, true);
            c2.flag('ears-back', false); c2.state('look-up');
            await Promise.all([p1, p2, p3]);
            await W(900); c2.flag('wide', false);

            // 5. the garden glows
            flowers.classList.add('bloomglow');
            cascade(flowers.querySelectorAll('.flower__light'), 170);
            c1.light(1, 1); c2.light(1, 1); c1.flag('lit', true); c2.flag('lit', true);
            spawnHeart(); heartTimer = setInterval(spawnHeart, 1900);
            await W(900);
            c1.slowBlink();

            // a firefly drifts down... the helper cannot resist
            const mx = c2.cx - 5, mote = fx('mote', mx + 3, 36);
            mote.animate([{ transform: T(mx + 3, 36), opacity: 0 }, { transform: T(mx + 1, 28), opacity: 1, offset: .3 }, { transform: T(mx - 1, 20), opacity: 1, offset: .7 }, { transform: T(mx, 16), opacity: 1 }],
                { duration: 2600, easing: 'ease-in-out', fill: 'forwards' });
            await W(1700); c2.state('tilt-b');
            await W(900); c2.state('');
            await c2.bat();
            mote.animate([{ transform: T(mx, 16), opacity: 1 }, { transform: T(mx - 4, 34), opacity: .9, offset: .6 }, { transform: T(mx - 7, 46), opacity: 0 }],
                { duration: 1500, easing: 'ease-out', fill: 'forwards' }).onfinish = () => mote.remove();
            await W(450); c2.flag('wide', true); c2.state('look-up');
            await W(900); c2.flag('wide', false);

            // the cats settle on either side of their garden
            const side = Math.min(27, reach - 1);
            await Promise.all([
                (async () => { await c1.walk(-side, 7); await c1.turn(1); c1.lie(true); c1.state(''); })(),
                (async () => { await W(300); await c2.walk(side, 10); await c2.turn(-1); c2.lie(true); c2.state('tilt-b'); })()
            ]);
            await W(900);
            bday.classList.add('on');
            await W(3200);
            replayBtn.classList.add('on');
        }

        // reduced motion: the same ending, revealed gently without the choreography
        async function calm(c1, c2, W) {
            flowers.classList.add('rm', 'garden-hidden');
            c1.place(-27, 1); c2.place(27, -1); c1.lie(true); c2.lie(true); c2.state('tilt-b');
            c1.q('.mouth-seed').style.opacity = '0';
            await W(1000);
            c1.eyes(true); c2.eyes(true);
            await W(1500);
            c1.light(.95, .9); c2.light(.95, .9); c1.flag('lit', true); c2.flag('lit', true);
            flowers.querySelectorAll('.cue:not(.flower__light)').forEach(on);
            q('.mist').classList.add('on');
            await W(1300);
            flowers.classList.remove('garden-hidden');
            flowers.classList.add('bloomglow');
            await W(2800);
            bday.classList.add('on');
            await W(2200);
            replayBtn.classList.add('on');
        }

        function start() {
            const id = ++live;
            const W = ms => new Promise((res, rej) => setTimeout(() => (id === live ? res() : rej(STOP)), ms));
            clearInterval(heartTimer); hearts.innerHTML = ''; clumps = [];
            // on Replay, the message and button leave quickly so the story starts in darkness
            [bday, replayBtn].forEach(e => { e.style.transition = 'opacity .35s ease'; e.classList.remove('on'); });
            setTimeout(() => { bday.style.transition = ''; replayBtn.style.transition = ''; }, 500);
            flowers.className = 'flowers';
            flowers.innerHTML = TEMPLATE + '<div class="mist"></div>';
            flowers.querySelectorAll(CUES.join(',')).forEach(e => e.classList.add('cue'));
            document.body.classList.add('armed', 'started');
            const c1 = new Cat('a', W), c2 = new Cat('b', W);
            c1.place(-60, 1); c2.place(60, -1);
            (reduced ? calm : story)(c1, c2, W).catch(e => { if (e !== STOP) console.error(e); });
        }

        replayBtn.addEventListener('click', start);
        start();
    })();
    </script>
</body>
</html>
