<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Cozy Birthday Room</title>
<style>
  :root{
    --panel-bg: linear-gradient(180deg,#fff7f2,#ffeef5);
    --panel-border:#e8b7c9;
    --ink:#5a3b4a;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#0d0912;
    font-family:'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    overflow:hidden;
  }
  #game-wrap{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #241a30 0%, #0d0912 70%);
  }
  #stage{
    position:relative;
    width:1280px; height:720px;
    transform-origin: center center;
    overflow:hidden;
    border-radius:14px;
    box-shadow: 0 30px 90px rgba(0,0,0,.7), 0 0 0 2px rgba(255,255,255,.05);
  }
  #room-bg{
    position:absolute; inset:0; width:100%; height:100%; z-index:0;
    display:block;
  }
  #front-glow{
    position:absolute; inset:0; z-index:500; pointer-events:none;
    background: radial-gradient(ellipse at 50% 40%, rgba(255,220,190,0) 40%, rgba(20,10,25,.28) 100%);
    mix-blend-mode:multiply;
  }
  .prop{
    position:absolute;
    pointer-events:none;
  }
  .prop svg{ display:block; width:100%; height:100%; overflow:visible; }

  /* ---------- Character ---------- */
  #character{
    position:absolute;
    width:88px; height:150px;
    left:0; top:0;
    transform: translate(0px,0px);
    z-index:100;
    pointer-events:none;
  }
  #char-svg{ width:100%; height:100%; overflow:visible; }
  #character.facing-left #char-body-group{ transform: scaleX(-1); transform-origin:44px center; }

  #character .leg{ transform-box: fill-box; transform-origin: 50% 0%; }
  #character.walking .leg-l{ animation: legSwingL .5s infinite ease-in-out; }
  #character.walking .leg-r{ animation: legSwingR .5s infinite ease-in-out; }
  @keyframes legSwingL{
    0%,100%{ transform: rotate(18deg); }
    50%{ transform: rotate(-18deg); }
  }
  @keyframes legSwingR{
    0%,100%{ transform: rotate(-18deg); }
    50%{ transform: rotate(18deg); }
  }
  #character .arm{ transform-box: fill-box; transform-origin: 50% 0%; }
  #character.walking .arm-l{ animation: armSwingR .5s infinite ease-in-out; }
  #character.walking .arm-r{ animation: armSwingL .5s infinite ease-in-out; }
  @keyframes armSwingL{
    0%,100%{ transform: rotate(-10deg); }
    50%{ transform: rotate(10deg); }
  }
  @keyframes armSwingR{
    0%,100%{ transform: rotate(10deg); }
    50%{ transform: rotate(-10deg); }
  }
  #char-body-group{ animation: idleBob 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
  #character.walking #char-body-group{ animation: walkBob .5s ease-in-out infinite; }
  @keyframes idleBob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-1.5px); }
  }
  @keyframes walkBob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-3px); }
  }
  #character.hidden-face #char-face{ opacity:0; }
  #character.hidden-face #char-hair-up{ opacity:1; }
  #char-hair-up{ opacity:0; }

  /* ---------- Interaction prompt ---------- */
  #prompt{
    position:absolute;
    transform: translate(-50%,-100%);
    background: rgba(30,18,28,.82);
    color:#fff2f7;
    padding:6px 14px;
    border-radius:20px;
    font-size:15px;
    font-weight:600;
    letter-spacing:.3px;
    border:1px solid rgba(255,210,230,.5);
    box-shadow:0 4px 18px rgba(0,0,0,.4);
    z-index:900;
    opacity:0;
    pointer-events:none;
    transition: opacity .18s ease, transform .18s ease;
    white-space:nowrap;
  }
  #prompt.show{ opacity:1; }
  #prompt::after{
    content:"";
    position:absolute; left:50%; top:100%;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-top-color: rgba(30,18,28,.82);
  }

  /* ---------- Dialogue box ---------- */
  #dialogue-overlay{
    position:absolute; inset:0; z-index:2000;
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:48px;
    background: rgba(10,6,12,0);
    pointer-events:none;
    transition: background .25s ease;
  }
  #dialogue-overlay.open{ background: rgba(10,6,12,.35); pointer-events:auto; }
  #dialogue-box{
    width:860px; max-width:88%;
    background: var(--panel-bg);
    border:2px solid var(--panel-border);
    border-radius:20px;
    padding:22px 30px 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5), inset 0 0 40px rgba(255,255,255,.4);
    transform: translateY(30px) scale(.96);
    opacity:0;
    transition: transform .3s cubic-bezier(.2,.9,.3,1.2), opacity .25s ease;
    position:relative;
  }
  #dialogue-overlay.open #dialogue-box{ transform: translateY(0) scale(1); opacity:1; }
  #dialogue-title{
    font-size:15px;
    font-weight:700;
    color:#c96b8d;
    letter-spacing:1px;
    text-transform:uppercase;
    margin:0 0 8px;
    display:flex; align-items:center; gap:8px;
  }
  #dialogue-title .dot{
    width:8px;height:8px;border-radius:50%;
    background: radial-gradient(circle,#ffd9ea,#e88bb0);
    box-shadow:0 0 8px #f3a8c6;
  }
  #dialogue-text{
    font-size:19px;
    line-height:1.6;
    color: var(--ink);
    margin:0;
    min-height:56px;
  }
  #dialogue-hint{
    margin-top:14px;
    font-size:12.5px;
    color:#a97f92;
    text-align:right;
  }

  /* ---------- HUD ---------- */
  #hud-instructions{
    position:absolute;
    bottom:14px; left:50%; transform:translateX(-50%);
    z-index:1500;
    color: rgba(255,240,248,.85);
    font-size:14px;
    letter-spacing:.5px;
    background: rgba(20,12,22,.45);
    padding:7px 18px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.12);
    pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,.6);
  }

  .twinkle{ animation: twinkle 2.6s ease-in-out infinite; }
  @keyframes twinkle{
    0%,100%{ opacity:.35; }
    50%{ opacity:1; }
  }
  .float-slow{ animation: floatSlow 4.5s ease-in-out infinite; }
  @keyframes floatSlow{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-8px); }
  }
</style>
</head>
<body>

<div id="game-wrap">
  <div id="stage">

    <svg id="room-bg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a2b62"/>
          <stop offset="45%" stop-color="#6b4a7a"/>
          <stop offset="100%" stop-color="#c98a8a"/>
        </linearGradient>
        <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff9e8" stop-opacity="1"/>
          <stop offset="60%" stop-color="#ffe9b0" stop-opacity=".5"/>
          <stop offset="100%" stop-color="#ffe9b0" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4a3a52"/>
          <stop offset="100%" stop-color="#5c4759"/>
        </linearGradient>
        <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8a6350"/>
          <stop offset="100%" stop-color="#6b4a3c"/>
        </linearGradient>
        <linearGradient id="bedGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f4c9d6"/>
          <stop offset="100%" stop-color="#e29fb5"/>
        </linearGradient>
        <linearGradient id="blanketGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#9b7fc9"/>
          <stop offset="100%" stop-color="#6e5aa8"/>
        </linearGradient>
        <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#c99566"/>
          <stop offset="100%" stop-color="#a8703f"/>
        </linearGradient>
        <linearGradient id="shelfGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#b98456"/>
          <stop offset="100%" stop-color="#8f6038"/>
        </linearGradient>
        <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff3c9" stop-opacity=".95"/>
          <stop offset="100%" stop-color="#fff3c9" stop-opacity="0"/>
        </radialGradient>
        <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
      </defs>

      <!-- back wall -->
      <rect x="0" y="0" width="1280" height="480" fill="url(#wallGrad)"/>
      <!-- wall wainscot line -->
      <rect x="0" y="420" width="1280" height="10" fill="#3f3140" opacity=".5"/>

      <!-- floor -->
      <rect x="0" y="430" width="1280" height="290" fill="url(#floorGrad)"/>
      <g stroke="#5a3d30" stroke-width="2" opacity=".35">
        <line x1="0" y1="480" x2="1280" y2="480"/>
        <line x1="0" y1="540" x2="1280" y2="540"/>
        <line x1="0" y1="610" x2="1280" y2="610"/>
        <line x1="0" y1="690" x2="1280" y2="690"/>
      </g>

      <!-- rug -->
      <ellipse cx="560" cy="560" rx="220" ry="70" fill="#caa0c9" opacity=".55"/>
      <ellipse cx="560" cy="560" rx="220" ry="70" fill="none" stroke="#f3d9e8" stroke-width="3" opacity=".5"/>

      <!-- window -->
      <g>
        <rect x="640" y="90" width="260" height="230" rx="8" fill="#2b1f3d"/>
        <rect x="652" y="100" width="236" height="180" rx="4" fill="url(#skyGrad)"/>
        <circle cx="840" cy="150" r="34" fill="url(#moonGlow)"/>
        <circle cx="840" cy="150" r="20" fill="#fff6da"/>
        <g fill="#fff6da" class="twinkle">
          <circle cx="700" cy="130" r="2"/>
          <circle cx="730" cy="180" r="1.6"/>
          <circle cx="770" cy="120" r="1.8"/>
          <circle cx="680" cy="220" r="1.4"/>
          <circle cx="810" cy="230" r="1.6"/>
        </g>
        <!-- window frame -->
        <rect x="652" y="100" width="236" height="180" fill="none" stroke="#3d2c50" stroke-width="6"/>
        <line x1="770" y1="100" x2="770" y2="280" stroke="#3d2c50" stroke-width="5"/>
        <line x1="652" y1="190" x2="888" y2="190" stroke="#3d2c50" stroke-width="5"/>
        <rect x="632" y="80" width="280" height="14" rx="4" fill="#8f6038"/>
        <!-- curtains -->
        <path d="M632 84 Q650 200 632 320 L668 320 Q656 200 668 84 Z" fill="#c98a9c" opacity=".85"/>
        <path d="M912 84 Q894 200 912 320 L876 320 Q888 200 876 84 Z" fill="#c98a9c" opacity=".85"/>
      </g>

      <!-- bookshelf -->
      <g>
        <rect x="440" y="150" width="190" height="270" rx="4" fill="url(#shelfGrad)" stroke="#6b4527" stroke-width="3"/>
        <g stroke="#6b4527" stroke-width="4">
          <line x1="440" y1="215" x2="630" y2="215"/>
          <line x1="440" y1="280" x2="630" y2="280"/>
          <line x1="440" y1="345" x2="630" y2="345"/>
        </g>
        <!-- books -->
        <g>
          <rect x="450" y="165" width="14" height="46" fill="#c96b8d"/>
          <rect x="466" y="160" width="14" height="51" fill="#7fb8b0"/>
          <rect x="482" y="168" width="14" height="43" fill="#e0b25a"/>
          <rect x="498" y="163" width="14" height="48" fill="#8b7fc9"/>
          <rect x="514" y="170" width="14" height="41" fill="#d98a6b"/>
          <rect x="560" y="166" width="14" height="45" fill="#7fa0c9"/>
          <rect x="576" y="160" width="14" height="51" fill="#c9a05a"/>
          <rect x="592" y="169" width="14" height="42" fill="#a8c97f"/>
        </g>
        <g>
          <rect x="452" y="228" width="30" height="28" rx="4" fill="#e0c9a0"/>
          <circle cx="530" cy="255" r="20" fill="#7fb8b0" opacity=".85"/>
          <rect x="560" y="232" width="16" height="48" fill="#c96b8d"/>
          <rect x="580" y="230" width="16" height="50" fill="#e0b25a"/>
        </g>
        <circle cx="480" cy="315" r="22" fill="#4a7a5c" class="float-slow"/>
        <rect x="470" y="315" width="20" height="30" fill="#8f6038"/>
      </g>

      <!-- fairy lights along wall -->
      <g>
        <path d="M40 60 Q 320 20 630 55" stroke="#7a6a86" stroke-width="2" fill="none" opacity=".6"/>
        <g class="twinkle" fill="#ffe6ad">
          <circle cx="80" cy="55" r="4"/>
          <circle cx="160" cy="42" r="4"/>
          <circle cx="240" cy="32" r="4"/>
          <circle cx="320" cy="26" r="4"/>
          <circle cx="400" cy="28" r="4"/>
          <circle cx="480" cy="36" r="4"/>
          <circle cx="560" cy="48" r="4"/>
        </g>
      </g>

      <!-- desk (right side) -->
      <g>
        <rect x="960" y="320" width="270" height="18" rx="3" fill="url(#deskGrad)" stroke="#6b4527" stroke-width="2"/>
        <rect x="975" y="338" width="14" height="90" fill="#8f6038"/>
        <rect x="1200" y="338" width="14" height="90" fill="#8f6038"/>
        <rect x="990" y="410" width="196" height="10" fill="#6b4527" opacity=".6"/>
        <!-- desk lamp -->
        <circle cx="1180" cy="290" r="38" fill="url(#lampGlow)"/>
        <rect x="1173" y="300" width="6" height="26" fill="#6b4527"/>
        <path d="M1150 300 Q1176 275 1206 300 L1198 312 Q1176 292 1158 312 Z" fill="#f2c9a0"/>
        <!-- little plant on desk -->
        <ellipse cx="1005" cy="322" rx="16" ry="6" fill="#6b4527"/>
        <path d="M995 322 Q990 300 998 285 Q1005 300 1005 322 Z" fill="#5a8f5c"/>
        <path d="M1005 322 Q1010 298 1002 280 Q1015 296 1013 322 Z" fill="#6fa86e"/>
      </g>

      <!-- chair -->
      <g>
        <rect x="1030" y="392" width="60" height="12" rx="3" fill="#a8703f"/>
        <rect x="1036" y="404" width="8" height="40" fill="#8f6038"/>
        <rect x="1076" y="404" width="8" height="40" fill="#8f6038"/>
        <rect x="1030" y="352" width="12" height="52" rx="4" fill="#c99566"/>
      </g>

      <!-- bed (left side) -->
      <g>
        <rect x="40" y="330" width="60" height="270" rx="8" fill="#6b4527"/>
        <rect x="60" y="380" width="300" height="220" rx="14" fill="url(#bedGrad)"/>
        <rect x="60" y="380" width="300" height="46" rx="14" fill="#fff" opacity=".55"/>
        <rect x="70" y="470" width="280" height="130" rx="18" fill="url(#blanketGrad)"/>
        <ellipse cx="120" cy="410" rx="34" ry="20" fill="#fff" opacity=".9"/>
        <ellipse cx="120" cy="410" rx="34" ry="20" fill="none" stroke="#e8c9d6" stroke-width="2"/>
        <g fill="#c98aa8" opacity=".5">
          <circle cx="230" cy="520" r="10"/>
          <circle cx="270" cy="545" r="7"/>
          <circle cx="200" cy="555" r="6"/>
        </g>
        <rect x="30" y="360" width="20" height="240" rx="6" fill="#8f6038"/>
      </g>

      <!-- small potted plant near bed -->
      <g>
        <ellipse cx="410" cy="602" rx="22" ry="8" fill="#00000022"/>
        <path d="M400 600 L420 600 L416 560 L404 560 Z" fill="#c98a6b"/>
        <path d="M410 560 Q392 520 400 490 Q412 525 412 560 Z" fill="#5a8f5c"/>
        <path d="M410 560 Q428 515 418 480 Q432 520 424 560 Z" fill="#6fa86e"/>
        <path d="M410 560 Q408 510 392 495 Q400 530 402 560 Z" fill="#7fbf7f"/>
      </g>

      <!-- front floor shadow under furniture for depth -->
      <ellipse cx="210" cy="606" rx="170" ry="16" fill="#000" opacity=".18"/>
      <ellipse cx="1090" cy="432" rx="150" ry="12" fill="#000" opacity=".18"/>
      <ellipse cx="530" cy="424" rx="110" ry="10" fill="#000" opacity=".16"/>

      <!-- warm ambient light overlay -->
      <ellipse cx="1150" cy="260" rx="220" ry="180" fill="url(#lampGlow)" opacity=".35"/>
    </svg>

    <!-- Interactive prop: birthday letter on desk -->
    <div class="prop" id="prop-letter" style="left:1040px; top:298px; width:46px; height:32px; z-index:429;">
      <svg viewBox="0 0 46 32">
        <rect x="0" y="0" width="46" height="32" rx="3" fill="#fdf3e2" stroke="#d9b98a" stroke-width="1.5"/>
        <path d="M0 2 L23 20 L46 2" fill="none" stroke="#d9b98a" stroke-width="1.5"/>
        <circle cx="23" cy="16" r="5" fill="#e0708f"/>
        <path d="M23 12 q3 3 0 5 q-3 -2 0 -5" fill="#ffd9e6"/>
      </svg>
    </div>

    <!-- Interactive prop: gift box -->
    <div class="prop float-slow" id="prop-gift" style="left:260px; top:562px; width:56px; height:50px; z-index:601;">
      <svg viewBox="0 0 56 50">
        <rect x="4" y="18" width="48" height="30" rx="3" fill="#7fa8d9"/>
        <rect x="4" y="18" width="48" height="10" fill="#5c86c4"/>
        <rect x="24" y="18" width="8" height="30" fill="#ffd9e6"/>
        <rect x="4" y="26" width="48" height="8" fill="#ffd9e6"/>
        <path d="M28 18 C18 4 10 10 16 18 Z" fill="#ffd9e6"/>
        <path d="M28 18 C38 4 46 10 40 18 Z" fill="#ffd9e6"/>
      </svg>
    </div>

    <!-- Interactive prop: glowing star near window -->
    <div class="prop twinkle" id="prop-star" style="left:706px; top:330px; width:46px; height:46px; z-index:401;">
      <svg viewBox="0 0 46 46">
        <defs>
          <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff6c9"/>
            <stop offset="100%" stop-color="#fff6c9" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="23" cy="23" r="23" fill="url(#starGlow)"/>
        <path d="M23 6 L27 19 L41 19 L29 27 L34 41 L23 32 L12 41 L17 27 L5 19 L19 19 Z" fill="#ffe9a3" stroke="#fff6d9" stroke-width="1"/>
      </svg>
    </div>

    <!-- Character -->
    <div id="character" class="facing-right">
      <svg id="char-svg" viewBox="0 0 88 150">
        <g id="char-body-group">
          <!-- shadow -->
          <ellipse cx="44" cy="146" rx="26" ry="7" fill="#000" opacity=".22"/>

          <g id="char-body-visual">
            <!-- back hair (for down/left/right) -->
            <path d="M20 55 Q10 90 20 118 Q26 122 30 116 Q22 88 30 58 Z" fill="#8a5a6e"/>
            <path d="M68 55 Q78 90 68 118 Q62 122 58 116 Q66 88 58 58 Z" fill="#8a5a6e"/>

            <!-- legs -->
            <g class="leg leg-l">
              <rect x="30" y="100" width="12" height="34" rx="5" fill="#fff" />
              <rect x="29" y="128" width="14" height="10" rx="3" fill="#5c4a6b"/>
            </g>
            <g class="leg leg-r">
              <rect x="46" y="100" width="12" height="34" rx="5" fill="#fff" />
              <rect x="45" y="128" width="14" height="10" rx="3" fill="#5c4a6b"/>
            </g>

            <!-- dress / body -->
            <path d="M28 62 Q44 54 60 62 L66 108 Q44 118 22 108 Z" fill="#b98fd6"/>
            <path d="M28 62 Q44 54 60 62 L62 78 Q44 86 26 78 Z" fill="#c9a0e0"/>
            <path d="M22 108 Q44 118 66 108 L64 100 Q44 108 24 100 Z" fill="#a67cc9" opacity=".7"/>

            <!-- arms -->
            <g class="arm arm-l">
              <path d="M28 66 Q16 74 16 92 Q16 98 22 98 Q24 82 32 70 Z" fill="#b98fd6"/>
              <circle cx="18" cy="96" r="7" fill="#ffdcc2"/>
            </g>
            <g class="arm arm-r">
              <path d="M60 66 Q72 74 72 92 Q72 98 66 98 Q64 82 56 70 Z" fill="#b98fd6"/>
              <circle cx="70" cy="96" r="7" fill="#ffdcc2"/>
            </g>

            <!-- neck -->
            <rect x="39" y="50" width="10" height="12" fill="#ffdcc2"/>

            <!-- head -->
            <ellipse cx="44" cy="34" rx="24" ry="25" fill="#ffdcc2"/>

            <!-- face group (hidden when facing up) -->
            <g id="char-face">
              <!-- blush -->
              <ellipse cx="30" cy="40" rx="5" ry="3" fill="#f5a3ac" opacity=".55"/>
              <ellipse cx="58" cy="40" rx="5" ry="3" fill="#f5a3ac" opacity=".55"/>
              <!-- eyes -->
              <g>
                <ellipse cx="34" cy="33" rx="4.2" ry="5.6" fill="#4a3350"/>
                <circle cx="35.4" cy="30.5" r="1.4" fill="#fff"/>
                <ellipse cx="54" cy="33" rx="4.2" ry="5.6" fill="#4a3350"/>
                <circle cx="55.4" cy="30.5" r="1.4" fill="#fff"/>
              </g>
              <path d="M40 44 Q44 47 48 44" stroke="#c9788a" stroke-width="2" fill="none" stroke-linecap="round"/>
            </g>

            <!-- hair front / bangs -->
            <path d="M20 30 Q22 8 44 6 Q66 8 68 30 Q68 16 44 14 Q20 16 20 30 Z" fill="#a3708a"/>
            <path d="M18 28 Q20 42 26 50 Q20 40 21 26 Z" fill="#a3708a"/>
            <path d="M70 28 Q68 42 62 50 Q68 40 67 26 Z" fill="#a3708a"/>
            <path d="M28 18 Q34 8 44 8 Q40 16 38 26 Q32 20 28 18 Z" fill="#b98298"/>
            <!-- hair bow -->
            <path d="M56 14 Q62 6 68 12 Q64 14 66 18 Q58 18 56 14 Z" fill="#e0708f"/>
            <circle cx="58" cy="14" r="2.4" fill="#c9506f"/>

            <!-- full back-of-head hair for facing up -->
            <ellipse id="char-hair-up" cx="44" cy="30" rx="25" ry="26" fill="#8a5a6e"/>
          </g>
        </g>
      </svg>
    </div>

    <div id="prompt">Press E to interact</div>

    <div id="dialogue-overlay">
      <div id="dialogue-box">
        <p id="dialogue-title"><span class="dot"></span> <span id="dialogue-title-text">Letter</span></p>
        <p id="dialogue-text"></p>
        <p id="dialogue-hint">Press E or click to close</p>
      </div>
    </div>

    <div id="front-glow"></div>
    <div id="hud-instructions">WASD / Arrow Keys to Move &bull; E to Interact</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STAGE_W = 1280, STAGE_H = 720;
  var stage = document.getElementById('stage');
  var wrap = document.getElementById('game-wrap');

  function fitStage(){
    var scale = Math.min(wrap.clientWidth / STAGE_W, wrap.clientHeight / STAGE_H, 1);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  // ---------- Character state ----------
  var charEl = document.getElementById('character');
  var CHAR_W = 88, CHAR_H = 150;
  var pos = { x: 460, y: 500 }; // top-left of sprite box, logical stage coords
  var SPEED = 220; // px/sec
  var facing = 'down'; // down, up, left, right

  // Feet hitbox (small box near the character's feet, used for collision + depth sorting)
  function feetBox(x, y){
    return { x: x + 28, y: y + 128, w: 32, h: 18 };
  }

  // Room boundary (walkable floor area)
  var ROOM_BOUNDS = { x: 50, y: 400, w: 1180, h: 290 };

  // Furniture collision rectangles (match the SVG art above), tested against feet box
  var OBSTACLES = [
    { x: 30, y: 355, w: 340, h: 255 },   // bed
    { x: 385, y: 585, w: 55, h: 40 },    // plant near bed
    { x: 440, y: 340, w: 190, h: 90 },   // bookshelf base
    { x: 955, y: 325, w: 280, h: 40 },   // desk
    { x: 1020, y: 390, w: 75, h: 60 },   // chair
    { x: 975, y: 280, w: 60, h: 60 }     // desk lamp/plant area
  ];

  function rectsOverlap(a, b){
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function tryMove(dx, dy){
    var nx = pos.x + dx, ny = pos.y + dy;

    // resolve X
    var fb = feetBox(nx, pos.y);
    var blockedX = fb.x < ROOM_BOUNDS.x || fb.x + fb.w > ROOM_BOUNDS.x + ROOM_BOUNDS.w;
    if (!blockedX){
      for (var i=0;i<OBSTACLES.length;i++){
        if (rectsOverlap(fb, OBSTACLES[i])){ blockedX = true; break; }
      }
    }
    if (!blockedX) pos.x = nx;

    // resolve Y
    fb = feetBox(pos.x, ny);
    var blockedY = fb.y < ROOM_BOUNDS.y || fb.y + fb.h > ROOM_BOUNDS.y + ROOM_BOUNDS.h;
    if (!blockedY){
      for (var j=0;j<OBSTACLES.length;j++){
        if (rectsOverlap(fb, OBSTACLES[j])){ blockedY = true; break; }
      }
    }
    if (!blockedY) pos.y = ny;
  }

  // ---------- Input ----------
  var keys = {};
  var KEY_MAP = {
    'KeyW':'up','ArrowUp':'up',
    'KeyS':'down','ArrowDown':'down',
    'KeyA':'left','ArrowLeft':'left',
    'KeyD':'right','ArrowRight':'right'
  };
  window.addEventListener('keydown', function(e){
    if (KEY_MAP[e.code]){ keys[KEY_MAP[e.code]] = true; e.preventDefault(); }
    if (e.code === 'KeyE'){ handleInteractKey(); e.preventDefault(); }
    if (e.code === 'Escape'){ closeDialogue(); }
  });
  window.addEventListener('keyup', function(e){
    if (KEY_MAP[e.code]){ keys[KEY_MAP[e.code]] = false; e.preventDefault(); }
  });
  window.addEventListener('blur', function(){ keys = {}; });

  // ---------- Interactive objects ----------
  var OBJECTS = [
    {
      id:'letter',
      title:'Birthday Letter',
      message:'"Another year of you — bright, kind, and wonderfully yourself. Here\'s to the adventures still waiting. Happy Birthday!"',
      triggerX: 1010, triggerY: 420, radius: 78,
      promptX: 1063, promptY: 292
    },
    {
      id:'gift',
      title:'Small Gift',
      message:'A little box tied with a ribbon, waiting to be opened. Some presents are best saved for the perfect moment. 🎁',
      triggerX: 288, triggerY: 590, radius: 78,
      promptX: 288, promptY: 556
    },
    {
      id:'star',
      title:'Glowing Star',
      message:'The star by the window glimmers softly, as if it were holding a wish just for you. ✨ Make one — it\'s listening.',
      triggerX: 729, triggerY: 380, radius: 90,
      promptX: 729, promptY: 322
    }
  ];

  var promptEl = document.getElementById('prompt');
  var nearestObject = null;
  var dialogueOpen = false;

  function updateProximity(){
    if (dialogueOpen){ promptEl.classList.remove('show'); return; }
    var cx = pos.x + CHAR_W/2, cy = pos.y + 128;
    var best = null, bestDist = Infinity;
    for (var i=0;i<OBJECTS.length;i++){
      var o = OBJECTS[i];
      var dx = cx - o.triggerX, dy = cy - o.triggerY;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if (dist <= o.radius && dist < bestDist){ best = o; bestDist = dist; }
    }
    nearestObject = best;
    if (best){
      promptEl.style.left = best.promptX + 'px';
      promptEl.style.top = best.promptY + 'px';
      promptEl.classList.add('show');
    } else {
      promptEl.classList.remove('show');
    }
  }

  var dialogueOverlay = document.getElementById('dialogue-overlay');
  var dialogueTitleText = document.getElementById('dialogue-title-text');
  var dialogueText = document.getElementById('dialogue-text');

  function openDialogue(obj){
    dialogueOpen = true;
    dialogueTitleText.textContent = obj.title;
    dialogueText.textContent = obj.message;
    dialogueOverlay.classList.add('open');
    promptEl.classList.remove('show');
  }
  function closeDialogue(){
    if (!dialogueOpen) return;
    dialogueOpen = false;
    dialogueOverlay.classList.remove('open');
  }
  dialogueOverlay.addEventListener('click', closeDialogue);

  function handleInteractKey(){
    if (dialogueOpen){ closeDialogue(); return; }
    if (nearestObject){ openDialogue(nearestObject); }
  }

  // ---------- Main loop ----------
  var lastTime = null;
  function frame(t){
    if (lastTime === null) lastTime = t;
    var dt = Math.min((t - lastTime) / 1000, 0.05);
    lastTime = t;

    if (!dialogueOpen){
      var mx = 0, my = 0;
      if (keys.up) my -= 1;
      if (keys.down) my += 1;
      if (keys.left) mx -= 1;
      if (keys.right) mx += 1;

      var moving = (mx !== 0 || my !== 0);
      if (moving){
        var len = Math.sqrt(mx*mx + my*my);
        mx /= len; my /= len;
        tryMove(mx * SPEED * dt, my * SPEED * dt);

        if (Math.abs(mx) > Math.abs(my)){
          facing = mx < 0 ? 'left' : 'right';
        } else if (my !== 0){
          facing = my < 0 ? 'up' : 'down';
        }
      }

      charEl.classList.toggle('walking', moving);
      charEl.classList.toggle('facing-left', facing === 'left');
      charEl.classList.toggle('hidden-face', facing === 'up');

      charEl.style.transform = 'translate(' + pos.x.toFixed(1) + 'px,' + pos.y.toFixed(1) + 'px)';
      charEl.style.zIndex = Math.floor(pos.y + CHAR_H);

      updateProximity();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
